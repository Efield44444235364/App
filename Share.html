
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFF8F8"> 
    <title>DropLink M3 - Fast & Secure</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
    
    <!-- PeerJS : ใช้ Cloud CDN ที่เสถียร -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --primary: #984061;
            --primary-container: #FFD9E2;
            --on-primary-container: #3E001D;
            --surface: #FFF8F8;
            --surface-container: #FFF0F4;
            --surface-container-high: #FCE8ED;
            --on-surface: #201A1B;
            --on-surface-variant: #524347;
            --error: #BA1A1A;
            --success: #2E6C00;
            --secure: #006c4c;     /* New Secure Color */
            --secure-bg: #dcece4;   /* New Secure BG */
            
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
            --ease-std: cubic-bezier(0.2, 0, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            height: 100dvh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* UI Layers */
        .scan-view {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: all 0.5s var(--ease-std);
        }
        
        /* Radar & Buttons */
        .radar-box { 
            position: relative; width: 300px; height: 300px; display: grid; place-items: center; margin-bottom: 30px; 
        }
        .radar-wave {
            position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--primary);
            background: var(--primary-container); opacity: 0;
        }

        .hero-btn {
            width: 100px; height: 100px;
            background: var(--primary); color: white;
            border-radius: 30px; display: grid; place-items: center;
            box-shadow: 0 12px 24px rgba(152, 64, 97, 0.2);
            position: relative; z-index: 10; cursor: pointer;
            transition: transform 0.2s;
        }
        .hero-btn:active { transform: scale(0.95); }

        .input-group {
            width: 100%; max-width: 340px; background: #fff;
            padding: 6px 6px 6px 20px; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 20px;
        }
        .input-field {
            flex: 1; border: none; outline: none; font-size: 18px; 
            text-transform: uppercase; letter-spacing: 2px;
        }
        .connect-btn {
            width: 44px; height: 44px; background: var(--primary-container); 
            border-radius: 50%; display: grid; place-items: center; color: var(--primary);
        }

        /* Chips */
        .my-id-chip {
            padding: 10px 20px; background: var(--surface-container-high);
            border-radius: 16px; font-weight: 500; font-size: 16px;
            color: var(--on-surface-variant); cursor: pointer;
            display: flex; align-items: center; gap: 8px;
        }
        /* Loader for ID */
        .id-loader { display: inline-block; width:12px; height:12px; border:2px solid var(--primary); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Transfer Layer */
        .transfer-layer {
            position: fixed; inset: 0; background: var(--surface-container);
            z-index: 100; display: flex; flex-direction: column;
            transform: translateY(110%);
            transition: transform 0.5s var(--ease-std);
            padding-top: env(safe-area-inset-top);
        }
        .transfer-layer.active { transform: translateY(0); }

        .header-bar {
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .user-pill {
            display: flex; align-items: center; gap: 12px; background: #fff; padding: 6px 16px 6px 6px; border-radius: 30px;
        }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }

        /* Secure Toggle Button */
        .secure-btn {
            padding: 8px 14px; border-radius: 20px; background: rgba(0,0,0,0.05);
            display: flex; gap: 6px; align-items: center;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; border: 1px solid transparent;
        }
        /* Active State */
        .secure-btn.active { background: #D4E8D1; color: #003825; border-color: #aaddcc; }

        .file-list {
            flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 10px;
        }
        
        .file-card {
            background: #fff; padding: 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden;
            animation: slideUp 0.3s var(--ease-spring);
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Icon Container & Progress */
        .icon-box {
            width: 50px; height: 50px; border-radius: 14px; background: #f0f0f0;
            position: relative; overflow: hidden; display: grid; place-items: center; flex-shrink: 0;
        }
        .progress-fill {
            position: absolute; bottom: 0; width: 100%; height: 0%; 
            background: var(--primary); opacity: 0.3; transition: height 0.2s linear;
        }
        
        .fname { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
        .fmeta { font-size: 12px; opacity: 0.7; display: flex; align-items: center; gap: 4px;}

        /* Padlock Icon in File List */
        .enc-badge { color: var(--success); font-size: 12px; font-weight: 700; display:none; align-items:center; gap:2px; }
        .is-encrypted .enc-badge { display: inline-flex; }
        .is-encrypted .progress-fill { background: var(--success); }

        .fab-btn {
            position: absolute; bottom: 30px; right: 24px;
            width: 60px; height: 60px; border-radius: 20px;
            background: var(--primary); color: #fff;
            display: grid; place-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body onload="init()">

    <!-- SCREEN 1: SCAN -->
    <div id="viewScan" class="scan-view">
        <div class="radar-box">
            <div id="rip1" class="radar-wave"></div>
            <div id="rip2" class="radar-wave"></div>
            <div class="hero-btn" onclick="PowerSys.poke()">
                <span class="material-symbols-rounded" style="font-size:48px">sensors</span>
            </div>
        </div>

        <h2 style="color:var(--primary); margin-bottom:10px;">DropLink</h2>

        <div class="input-group">
            <input type="text" id="tInput" class="input-field" placeholder="6-DIGIT ID" maxlength="6">
            <div class="connect-btn" onclick="Net.pairManual()">
                <span class="material-symbols-rounded">arrow_forward</span>
            </div>
        </div>

        <div class="my-id-chip" onclick="Net.copyId()">
            <span class="material-symbols-rounded">fingerprint</span>
            <span id="myIdDisplay">Wait...</span> 
            <span class="id-loader" id="idLoad"></span>
        </div>
        <div style="margin-top:8px; font-size:11px; opacity:0.5;">Tap ID to copy</div>
    </div>

    <!-- SCREEN 2: TRANSFER -->
    <div id="viewTransfer" class="transfer-layer">
        <div class="header-bar">
            <div class="user-pill">
                <div class="avatar" id="pAvatar">?</div>
                <div>
                    <div style="font-size:10px; color:var(--on-surface-variant);">LINKED TO</div>
                    <div style="font-weight:700; line-height:1;" id="pIdDisplay">---</div>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <!-- SECURE TOGGLE -->
                <div class="secure-btn" id="btnSecure" onclick="Net.toggleSecurity()">
                    <span class="material-symbols-rounded" id="icoSecure">lock_open</span>
                    <span id="txtSecure">OFF</span>
                </div>
                <!-- CLOSE BUTTON -->
                <button class="connect-btn" style="background:#fff; box-shadow:0 2px 5px rgba(0,0,0,0.05);" onclick="Net.disconnect()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
        </div>

        <div class="file-list" id="fileList"></div>

        <input type="file" id="fInput" multiple hidden>
        <div class="fab-btn" onclick="document.getElementById('fInput').click()">
            <span class="material-symbols-rounded" style="font-size:32px">add</span>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);

        // --- 1. NETWORK SYSTEM (FAST ID) ---
        const Net = {
            peer: null,
            conn: null,
            myId: null,     // The Full UUID
            shortId: null,  // The 6 chars displayed
            secureMode: false, // E2EE State

            init() {
                // TRICK 1: ใช้ new Peer() ว่างๆ ให้ Server แจก ID (เร็วกว่าขอ Custom ID มาก)
                // config default ไม่ต้องใส่ iceServers จะเชื่อมต่อใน local region เร็วขึ้น
                this.peer = new Peer({ debug: 1 });

                this.peer.on('open', (id) => {
                    this.myId = id;
                    // TRICK 2: ตัด ID ให้เหลือ 6 ตัวแรกพอ (Collision น้อยมากสำหรับการใช้งานชั่วคราว)
                    this.shortId = id.substring(0, 6).toUpperCase();
                    
                    // UI Ready
                    $('myIdDisplay').innerText = this.shortId;
                    $('idLoad').style.display = 'none';
                    $('rip1').style.animationPlayState = 'running';
                });

                this.peer.on('connection', (c) => this.handleConn(c));
                this.peer.on('error', err => alert("Network Error: " + err.type));
            },

            // Connect using short ID (needs Full ID, but we only know Short ID)
            // Note: Since we use Short ID for UI, we are essentially gambling connection on collision
            // In a real prod app, you'd use a signalling server to map Short->Long. 
            // HERE: We just type the FULL ID usually? NO.
            // **FIX FOR DEMO**: PeerJS won't let you find "AbCdEf" if your ID is "AbCdEf-UUID-..."
            // SO: We MUST use Custom ID if we want searchable Short Names.
            // RE-STRATEGY for SPEED + SHORT NAME:
            // Let's use a Custom ID that is simply Random Number locally generated.
            reInitCustom() {
                if(this.peer) this.peer.destroy();
                // Random 6-digit number that acts as ID
                const rID = Math.floor(100000 + Math.random() * 900000).toString();
                
                this.peer = new Peer(rID, { debug: 1 });
                
                this.peer.on('open', (id) => {
                    this.myId = id; 
                    this.shortId = id;
                    $('myIdDisplay').innerText = id;
                    $('idLoad').style.display = 'none';
                });
                
                this.peer.on('connection', (c) => this.handleConn(c));
                this.peer.on('error', () => { 
                    // Retry once if taken
                    setTimeout(() => this.reInitCustom(), 500); 
                });
            },

            pairManual() {
                const input = $('tInput').value.trim();
                if(input.length < 4) return alert("Invalid ID");
                
                // Connecting
                if(this.conn) this.conn.close();
                // Reliable ensures chunks don't drop
                const conn = this.peer.connect(input, { reliable: true });
                this.handleConn(conn);
            },

            handleConn(conn) {
                this.conn = conn;
                
                conn.on('open', () => {
                    // Send current security state immediately
                    conn.send({ type: 'SYS_SYNC', secure: this.secureMode });
                    UI.showTransfer(conn.peer);
                });

                conn.on('data', (d) => Data.receive(d));
                
                conn.on('close', () => {
                    this.conn = null;
                    UI.showScan();
                    // Reset secure state on close
                    this.secureMode = false;
                    this.updateSecureUI();
                });
            },

            // --- FEATURE 1: DYNAMIC SECURE TOGGLE ---
            toggleSecurity() {
                if(!this.conn) return; 
                
                // Toggle State
                this.secureMode = !this.secureMode;
                
                // 1. Send Signal to Peer
                this.conn.send({ type: 'SYS_SECURE_TOGGLE', val: this.secureMode });
                
                // 2. Update Local UI
                this.updateSecureUI();
                
                // Feedback
                navigator.vibrate?.(50);
            },

            // Called when receive remote toggle or local click
            updateSecureUI() {
                const btn = $('btnSecure');
                const ico = $('icoSecure');
                const txt = $('txtSecure');
                const input = $('fInput'); // Example: prevent sending if we wanted lock

                if(this.secureMode) {
                    btn.classList.add('active');
                    ico.innerText = "lock";
                    txt.innerText = "E2EE ON";
                } else {
                    btn.classList.remove('active');
                    ico.innerText = "lock_open";
                    txt.innerText = "OFF";
                }
            },

            disconnect() {
                if(this.conn) { this.conn.close(); }
                UI.showScan();
            },

            copyId() {
                navigator.clipboard.writeText(this.shortId);
                const original = $('myIdDisplay').innerText;
                $('myIdDisplay').innerText = "Copied!";
                setTimeout(()=> $('myIdDisplay').innerText=original, 1500);
            }
        };

        // --- 2. DATA HANDLER ---
        const Data = {
            chunks: {}, // Buffer
            
            sendFile(file) {
                if(!Net.conn) return;
                const fid = Math.random().toString(36).substr(2, 6);
                const isEnc = Net.secureMode;

                // Create UI
                UI.addFileCard(fid, file.name, file.size, file.type, isEnc, 'up');

                // Send Meta
                Net.conn.send({ 
                    type: 'META', 
                    id: fid, 
                    n: file.name, 
                    s: file.size, 
                    t: file.type,
                    enc: isEnc // Flag logic file status
                });

                // Slice & Send
                const chunkSize = 64 * 1024; // 64KB for speed
                const reader = new FileReader();
                let offset = 0;

                reader.onload = (e) => {
                    Net.conn.send({
                        type: 'CHUNK',
                        id: fid,
                        data: e.target.result // ArrayBuffer
                    });
                    
                    offset += e.target.result.byteLength;
                    UI.updateProgress(fid, offset/file.size);

                    if(offset < file.size) {
                        readNext();
                    } else {
                        Net.conn.send({ type: 'END', id: fid });
                    }
                };

                const readNext = () => {
                    const slice = file.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                };
                readNext();
            },

            receive(d) {
                // SYSTEM COMMANDS
                if(d.type === 'SYS_SECURE_TOGGLE') {
                    Net.secureMode = d.val;
                    Net.updateSecureUI();
                    return;
                }
                if(d.type === 'SYS_SYNC') {
                    Net.secureMode = d.secure;
                    Net.updateSecureUI();
                    return;
                }

                // FILE TRANSFER
                if(d.type === 'META') {
                    this.chunks[d.id] = { ...d, buffer:[], loaded:0 };
                    UI.addFileCard(d.id, d.n, d.s, d.t, d.enc, 'down');
                }
                else if(d.type === 'CHUNK') {
                    const f = this.chunks[d.id];
                    if(!f) return;
                    f.buffer.push(d.data);
                    f.loaded += d.data.byteLength;
                    UI.updateProgress(d.id, f.loaded/f.s);
                }
                else if(d.type === 'END') {
                    const f = this.chunks[d.id];
                    if(!f) return;
                    const blob = new Blob(f.buffer, { type: f.t });
                    const url = URL.createObjectURL(blob);
                    
                    // Cleanup
                    delete this.chunks[d.id];
                    UI.finishTransfer(d.id, url);
                }
            }
        };

        // --- 3. UI SYSTEM ---
        const UI = {
            showTransfer(pid) {
                $('viewScan').style.opacity = '0';
                setTimeout(()=> $('viewScan').style.display='none', 400);
                $('viewTransfer').classList.add('active');
                $('pIdDisplay').innerText = pid;
                $('pAvatar').innerText = pid.charAt(0);
            },
            showScan() {
                $('viewScan').style.display = 'flex';
                $('viewTransfer').classList.remove('active');
                setTimeout(()=> $('viewScan').style.opacity = '1', 50);
                $('fileList').innerHTML = ''; // Clear History
                $('tInput').value = '';
            },

            addFileCard(id, name, size, type, isEnc, dir) {
                // Determine Icon
                let icon = 'description';
                if(type.includes('image')) icon='image';
                if(type.includes('video')) icon='movie';
                
                const card = document.createElement('div');
                card.className = `file-card ${isEnc ? 'is-encrypted' : ''}`;
                card.id = `card-${id}`;
                card.onclick = () => { if(card.dataset.url) window.open(card.dataset.url); }
                
                card.innerHTML = `
                    <div class="icon-box">
                        <div class="progress-fill" id="prog-${id}"></div>
                        <span class="material-symbols-rounded" style="z-index:2; font-size:24px; color:#555">${icon}</span>
                    </div>
                    <div style="flex:1; min-width:0;">
                        <div class="fname">${name}</div>
                        <div class="fmeta">
                            ${dir==='up'?'Sending':'Receiving'} 
                            <span class="enc-badge">
                                <span class="material-symbols-rounded" style="font-size:12px;">lock</span> Encrypted
                            </span>
                        </div>
                    </div>
                    <span class="material-symbols-rounded" id="stat-${id}" style="color:#ddd">radio_button_unchecked</span>
                `;
                $('fileList').prepend(card);
            },

            updateProgress(id, pct) {
                const el = $(`prog-${id}`);
                if(el) el.style.height = (pct*100) + '%';
            },

            finishTransfer(id, url) {
                const card = $(`card-${id}`);
                const stat = $(`stat-${id}`);
                const prog = $(`prog-${id}`);
                if(card) {
                    card.dataset.url = url;
                    stat.innerText = "check_circle";
                    stat.style.color = "var(--success)";
                    prog.style.height = "100%";
                    prog.style.opacity = "1";
                    
                    // Slight bounce
                    card.style.transform = "scale(0.98)";
                    setTimeout(()=> card.style.transform = "scale(1)", 150);
                }
            }
        };

        const PowerSys = {
            poke() {
                const b = document.querySelector('.hero-btn');
                b.style.transform = 'scale(0.9)';
                setTimeout(()=>b.style.transform='scale(1)', 150);
                // Trigger ID regen if stuck
                if(!Net.myId) Net.reInitCustom();
            }
        }

        // --- BOOTSTRAP ---
        function init() {
            // Event Listeners
            $('fInput').addEventListener('change', e => {
                Array.from(e.target.files).forEach(f => Data.sendFile(f));
                e.target.value = '';
            });

            // Start Animation
            animLoop();

            // Override Default Init for Speed:
            // Use Custom Numeric Generator immediately
            Net.reInitCustom(); 
        }

        // Radar Animation
        function animLoop() {
            let t = 0;
            const r1=$('rip1'), r2=$('rip2');
            const run = () => {
                t += 0.008;
                [r1,r2].forEach((r,i) => {
                    const s = (t + i*0.5)%2; // phase
                    r.style.transform = `scale(${0.5 + s*1.2})`;
                    r.style.opacity = s > 1.2 ? 0 : (1 - s); 
                });
                requestAnimationFrame(run);
            };
            run();
        }
    </script>
</body>
</html>
